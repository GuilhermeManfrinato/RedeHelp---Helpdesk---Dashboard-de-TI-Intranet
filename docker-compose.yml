services:
  db-mysql:
    image: mysql:8.0
    container_name: db-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: helpdesk_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - helpdesk-net

  app:
    build: .
    container_name: 2gac_helpdesk_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db-mysql
      DB_USER: root
      DB_PASS: root
      DB_NAME: helpdesk_db
    depends_on:
      db-mysql:
        condition: service_healthy
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge